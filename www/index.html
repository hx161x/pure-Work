<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fc">
  <title>Pure Work</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="brand">
      <img src="logo.svg" alt="Pure Work">
      <div class="pulse"><i></i><span>Mobile App</span></div>
    </section>
    <section class="card">
      <div class="icon">↗</div>
      <h1>Pure Work wird gestartet</h1>
      <p>Die App verbindet sich sicher mit deinem Pure-Work-Arbeitsbereich.</p>
      <button id="openApp">Pure Work öffnen</button>
      <small id="status">Verbindung wird geprüft …</small>
    </section>
  </main>
  <script src="runtime-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
